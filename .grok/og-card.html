<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: "Cormorant Garamond";
      src: url("fonts/CormorantGaramond-Bold.ttf") format("truetype");
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: "Cormorant Garamond";
      src: url("fonts/CormorantGaramond-SemiBold.ttf") format("truetype");
      font-weight: 600;
      font-style: normal;
    }
    @font-face {
      font-family: "DM Sans";
      src: url("fonts/DMSans-SemiBold.ttf") format("truetype");
      font-weight: 600;
      font-style: normal;
    }
    @font-face {
      font-family: "DM Sans";
      src: url("fonts/DMSans-Medium.ttf") format("truetype");
      font-weight: 500;
      font-style: normal;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }

    .card {
      position: relative;
      width: 1200px;
      height: 630px;
      background: linear-gradient(115deg, #E23940 0%, #5A1F55 72%, #2C0A3D 100%);
      color: #EADFD9;
      font-family: "DM Sans", sans-serif;
    }

    .vignette {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 80% at 50% 48%, transparent 30%, rgba(26, 10, 18, 0.38) 100%);
      pointer-events: none;
    }

    .frame {
      position: absolute;
      inset: 28px;
      border: 1px solid rgba(234, 223, 217, 0.28);
      pointer-events: none;
    }
    .frame::before {
      content: "";
      position: absolute;
      inset: 6px;
      border: 1px solid rgba(255, 169, 76, 0.22);
    }

    .field {
      position: absolute;
      inset: 0;
      opacity: 0.22;
      pointer-events: none;
    }

    .lockup {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 780px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .mark {
      width: 72px;
      height: 72px;
      margin-bottom: 18px;
      color: #EADFD9;
    }

    .eyebrow {
      font-family: "DM Sans", sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: #FFA94C;
      margin-bottom: 18px;
    }

    h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 700;
      font-size: 92px;
      line-height: 0.88;
      letter-spacing: 0.04em;
      color: #EADFD9;
      font-kerning: normal;
    }
    h1 .line2 {
      display: block;
      font-size: 68px;
      letter-spacing: 0.085em;
      margin-top: 6px;
    }

    .rule {
      width: 88px;
      height: 2px;
      background: #FFA94C;
      margin: 22px 0 16px;
      border-radius: 2px;
    }

    .tagline {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 600;
      font-size: 26px;
      font-style: italic;
      letter-spacing: 0.04em;
      color: #EADFD9;
      opacity: 0.92;
    }

    .meta {
      margin-top: 10px;
      font-family: "DM Sans", sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: rgba(234, 223, 217, 0.72);
    }
    .meta span { color: #FFA94C; margin: 0 10px; }

    .grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.07;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }
  </style>
</head>
<body>
  <div class="card">
    <svg class="field" viewBox="0 0 1200 630" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <linearGradient id="hs" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#EADFD9" stop-opacity="0.9"/>
          <stop offset="100%" stop-color="#EADFD9" stop-opacity="0.15"/>
        </linearGradient>
      </defs>
      <g fill="none" stroke="url(#hs)" stroke-width="1.4">
        <path d="M180 -20 C 280 160, 80 320, 180 480 S 280 720, 180 820"/>
        <path d="M180 -20 C 80 160, 280 320, 180 480 S 80 720, 180 820"/>
        <path d="M1020 -20 C 1120 160, 920 320, 1020 480 S 1120 720, 1020 820"/>
        <path d="M1020 -20 C 920 160, 1120 320, 1020 480 S 920 720, 1020 820"/>
        <path d="M40 -20 C 140 180, -60 360, 40 540 S 140 780, 40 900" opacity="0.5"/>
        <path d="M1160 -20 C 1260 180, 1060 360, 1160 540 S 1260 780, 1160 900" opacity="0.5"/>
      </g>
      <g fill="#EADFD9">
        <circle cx="180" cy="140" r="3.2" opacity="0.55"/>
        <circle cx="180" cy="315" r="3.2" opacity="0.4"/>
        <circle cx="180" cy="490" r="3.2" opacity="0.55"/>
        <circle cx="1020" cy="140" r="3.2" opacity="0.55"/>
        <circle cx="1020" cy="315" r="3.2" opacity="0.4"/>
        <circle cx="1020" cy="490" r="3.2" opacity="0.55"/>
      </g>
    </svg>

    <div class="vignette"></div>
    <div class="frame"></div>

    <div class="lockup">
      <svg class="mark" viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <path d="M13 5c8 6 8 24 0 30" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M27 5c-8 6-8 24 0 30" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M14.5 11h11" stroke="#FFA94C" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M16 16h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M16 20h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M16 24h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M14.5 29h11" stroke="#FFA94C" stroke-width="1.6" stroke-linecap="round"/>
        <circle cx="13.2" cy="11" r="1.6" fill="#FFA94C"/>
        <circle cx="26.8" cy="11" r="1.6" fill="#FFA94C"/>
        <circle cx="15.2" cy="20" r="1.6" fill="currentColor"/>
        <circle cx="24.8" cy="20" r="1.6" fill="currentColor"/>
        <circle cx="13.2" cy="29" r="1.6" fill="#FFA94C"/>
        <circle cx="26.8" cy="29" r="1.6" fill="#FFA94C"/>
      </svg>

      <div class="eyebrow">Red biotechnology</div>
      <h1>
        FUTURE
        <span class="line2">BIOTECH EXPO</span>
      </h1>
      <div class="rule"></div>
      <div class="tagline">The science that treats.</div>
      <div class="meta">Philadelphia <span>·</span> 2027</div>
    </div>

    <div class="grain"></div>
  </div>
</body>
</html>
